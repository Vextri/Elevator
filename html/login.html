<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Blaise Swan">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="pragma" content="no-cache">
  <meta name="description" content="Login to access the elevator code system. Enter your username and password to continue.">
  <link href="../css/bootstrap.css" type="text/css" rel="stylesheet"/>
  <link href="../css/projectsVI.css" type="text/css" rel="stylesheet"/>
  <title>Login</title>
  <style>
    /* Clean, modern styling */
    .login-container {
      max-width: 450px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      border: 1px solid #e0e6ed;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
      color: #333;
      font-size: 2.2rem;
      font-weight: 300;
      border-bottom: 2px solid #0078d7;
      padding-bottom: 1rem;
    }
    
    .status-card {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
    }
    
    .status-card.info {
      background: #e3f2fd;
      border-color: #2196f3;
      color: #1976d2;
    }
    
    .status-card.success {
      background: #e8f5e8;
      border-color: #4caf50;
      color: #2e7d32;
    }
    
    .status-card.error {
      background: #ffebee;
      border-color: #f44336;
      color: #c62828;
    }
    
    .status-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    
    .status-description {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    
    .form-group {
      margin-bottom: 1.2rem;
    }
    
    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #495057;
    }
    
    .form-input {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #ced4da;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #0078d7;
      box-shadow: 0 0 0 3px rgba(0, 120, 215, 0.1);
    }
    
    .login-button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #0078d7, #005fa3);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .login-button:hover {
      background: linear-gradient(135deg, #005fa3, #004578);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 120, 215, 0.3);
    }
    
    .login-button:active {
      transform: translateY(0);
    }
    
    .home-link {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.5rem 1rem;
      background: #6c757d;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      transition: background 0.3s ease;
    }
    
    .home-link:hover {
      background: #5a6268;
      color: white;
      text-decoration: none;
    }
    
    .footer-link {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e9ecef;
    }
    
    .footer-link a {
      color: #0078d7;
      text-decoration: none;
    }
    
    .footer-link a:hover {
      text-decoration: underline;
    }
    
    .footer {
      text-align: center;
      margin-top: 3rem;
      color: #6c757d;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="request-access-bg">
  <a href="website.html" class="home-link">Home</a>
  
  <div class="login-container">
    <h2 class="login-header">System Login</h2>
    
    <!-- Error message display -->
    <div id="error-message" class="status-card error" style="display: none;">
      <div class="status-title">Login Error</div>
      <div class="status-description" id="error-text"></div>
    </div>
    
    <!-- Card Scan Status Display -->
    <div id="card-scan-status" class="status-card info" style="display: none;">
      <div class="status-title" id="card-status-title">Card Scanner Active</div>
      <div class="status-description" id="card-status-description">
        You can log in by scanning your student card with the Arduino system.
      </div>
    </div>

    <!-- Audio player (hidden) -->
    <audio id="background-audio" loop>
      <source src="../audio/teto.mp3" type="audio/mp3">
      Your browser does not support the audio element.
    </audio>

    <form id="login-form" action="../php/login1.php" method="post">
      <div class="form-group">
        <label for="username" class="form-label">Username:</label>
        <input type="text" id="username" name="username" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Password:</label>
        <input type="password" id="password" name="password" class="form-input" required>
      </div>
      
      <button type="submit" class="login-button">Login</button>
    </form>

    <div class="footer-link">
      <a href="request_access.html">Don't have an account? Request access here.</a>
    </div>
  </div>

  <div class="footer">
    &copy; 2025 Blaise Swan. All rights reserved.
  </div>
<  <!-- JavaScript for functionality -->
<script>
  window.onload = function() {
    var usernameInput = document.getElementById('username');
      
    // Focus the Username input field
    usernameInput.focus();
    
    // Check for error messages in URL
    checkForErrors();
    
    // Check if user was logged in via card scan
    checkCardScanStatus();
    
    // Play background audio when the page loads
    var audioElement = document.getElementById("background-audio");
    audioElement.volume = 0.5;
    document.body.addEventListener('click', function() {
      if (audioElement.paused) {
        audioElement.play();
      }
    });

    // Add validation for username and password length
    document.getElementById('login-form').addEventListener('submit', function(e) {
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      if (username.length < 7 || password.length < 7) {
        alert('Username and password must both be at least 7 characters.');
        e.preventDefault();
      } else {
        stopCardLoginPolling();
        updateCardScanStatus('Logging in manually...', 'info');
      }
    });
    
    // Stop polling when page is about to unload
    window.addEventListener('beforeunload', function() {
      stopCardLoginPolling();
    });
  };
  
  // Global variables for polling
  var cardLoginPollInterval;
  var isPolling = false;
  
  function checkForErrors() {
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    
    if (error) {
      const errorDiv = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');
      
      switch(error) {
        case 'length':
          errorText.textContent = 'Username and password must both be at least 7 characters.';
          break;
        case 'invalid':
          errorText.textContent = 'Invalid username or password.';
          break;
        default:
          errorText.textContent = 'An error occurred during login.';
      }
      
      errorDiv.style.display = 'block';
      
      // Clear the error from URL
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }
  
  function checkCardScanStatus() {
    // Always show card scan status and start polling 
    document.getElementById('card-scan-status').style.display = 'block';
    
    console.log('Starting card scanner monitoring...');
    updateCardScanStatus('Card scanner system ready - scan your card to login automatically', 'info');
    
    // Start polling for card login immediately
    startCardLoginPolling();
  }
  
  function startCardLoginPolling() {
    if (isPolling) return; // Prevent multiple polling intervals
    
    isPolling = true;
    console.log('Starting card login polling...');
    
    // Update the card scan status to show polling is active
    updateCardScanStatus('Monitoring for card scans...', 'info');
    
    // Start polling for card login every 1 second
    cardLoginPollInterval = setInterval(function() {
      checkForCardLogin();
    }, 1000);
  }
  
  function stopCardLoginPolling() {
    if (cardLoginPollInterval) {
      clearInterval(cardLoginPollInterval);
      cardLoginPollInterval = null;
      isPolling = false;
      console.log('Stopped card login polling');
    }
  }
  
  function checkForCardLogin() {
    fetch('../php/check_card_login.php?' + new Date().getTime(), {
      method: 'GET',
      headers: {
        'Content-Type': 'application/json',
      }
    })
    .then(response => response.json())
    .then(data => {
      console.log('Card status check response:', data);
      
      if (data.status === 'logged_in' || data.status === 'logged_in_manual') {
        console.log('Login detected! Redirecting immediately...');
        updateCardScanStatus('Login successful! Redirecting...', 'success');
        stopCardLoginPolling();
        
        // Simple, direct redirect
        window.location.href = '../php/dashboard.php';
        
      } else if (data.status === 'not_logged_in') {
        // Continue polling
        console.log('No login detected, continuing to poll...');
      }
    })
    .catch(error => {
      console.error('Error checking card status:', error);
    });
  }
  
  function updateCardScanStatus(message, type) {
    var statusDiv = document.getElementById('card-scan-status');
    var titleElement = document.getElementById('card-status-title');
    var descElement = document.getElementById('card-status-description');
    
    // Update classes based on type
    statusDiv.className = 'status-card ' + type;
    
    // Update content
    titleElement.textContent = message;
    
    if (type === 'success') {
      descElement.textContent = 'Redirecting to dashboard...';
    } else if (type === 'info') {
      descElement.textContent = 'Scan your student card with the Arduino system for automatic login.';
    } else if (type === 'error') {
      descElement.textContent = 'There was an issue with the card scanner. Please try manual login.';
    }
  }
</script>

</body>
</html>
