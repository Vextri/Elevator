<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Visual Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }
        
        .elevator-building {
            background: #2c3e50;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .building-title {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .elevator-shaft {
            width: 120px;
            height: 360px;
            background: linear-gradient(to bottom, #34495e, #2c3e50);
            border: 3px solid #1abc9c;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .floor-markers {
            position: absolute;
            left: -50px;
            top: 0;
            height: 100%;
            width: 40px;
        }
        
        .floor-marker {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background: #34495e;
            border-radius: 50%;
            border: 2px solid #1abc9c;
        }
        
        .floor-marker.floor-3 { top: 30px; }
        .floor-marker.floor-2 { top: 150px; }
        .floor-marker.floor-1 { bottom: 30px; }
        
        .elevator-car {
            width: 100px;
            height: 80px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            position: absolute;
            left: 10px;
            bottom: 20px;
            border-radius: 8px;
            transition: bottom 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 2px solid #1abc9c;
        }
        
        .elevator-car.moving {
            box-shadow: 0 5px 25px rgba(26, 188, 156, 0.6);
        }
        
        .car-door {
            width: 45px;
            height: 60px;
            background: #2c3e50;
            position: absolute;
            top: 10px;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .car-door.left { left: 5px; }
        .car-door.right { right: 5px; }
        
        .car-door.open { width: 15px; }
        
        .car-light {
            width: 8px;
            height: 8px;
            background: #f39c12;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            right: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .controls-panel {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-width: 300px;
        }
        
        .panel-title {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 1.4rem;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .connection-status.connected {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .connection-status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-indicator.connected {
            background-color: #28a745;
            animation: blink 2s infinite;
        }
        
        .status-indicator.disconnected {
            background-color: #dc3545;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        .floor-display {
            text-align: center;
            font-size: 2rem;
            color: #e74c3c;
            background: #2c3e50;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
        }
        
        .button-groups {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .arrow-buttons {
            display: flex;
            justify-content: center;
        }
        
        .floor-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .door-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-floor {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }
        
        .btn-floor.active {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }
        
        .btn-arrow {
            background: linear-gradient(45deg, #1abc9c, #16a085);
            color: white;
            font-size: 2rem;
        }
        
        .btn-door {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
            font-size: 1.2rem;
        }
        
        .btn-door.selected {
            background: linear-gradient(45deg, #27ae60, #229954);
        }
        
        .status-message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            min-height: 20px;
            color: #2c3e50;
            font-weight: bold;
        }
        
        .status-message.loading {
            background: #f1c40f;
            color: #2c3e50;
        }
        
        .status-message.success {
            background: #2ecc71;
            color: white;
        }
        
        .status-message.error {
            background: #e74c3c;
            color: white;
        }
        
        .info-panel {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .lockout-status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        
        .lockout-status.locked-out {
            background-color: #e74c3c;
            color: white;
            border: 2px solid #c0392b;
        }
        
        .lockout-status.operational {
            background-color: #2ecc71;
            color: white;
            border: 1px solid #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Visual Elevator Building -->
        <div class="elevator-building">
            <div class="building-title">Test Elevator Shaft</div>
            <div class="elevator-shaft">
                <!-- Floor Markers -->
                <div class="floor-markers">
                    <div class="floor-marker floor-3">3</div>
                    <div class="floor-marker floor-2">2</div>
                    <div class="floor-marker floor-1">1</div>
                </div>
                
                <!-- Elevator Car -->
                <div class="elevator-car" id="elevator-car">
                    <div class="car-door left" id="door-left"></div>
                    <div class="car-door right" id="door-right"></div>
                    <div class="car-light"></div>
                </div>
            </div>
        </div>
        
        <!-- Control Panel -->
        <div class="controls-panel">
            <div class="panel-title">Elevator Test Controls</div>
            
            <div id="connectionStatus" class="connection-status disconnected">
                <div class="status-indicator disconnected"></div>
                Checking connection...
            </div>
            
            <!-- Lockout Status -->
            <div id="lockoutStatus" class="lockout-status operational" style="display: none;">
                System Operational
            </div>
            
            <div class="floor-display">
                FLOOR <span id="current-floor">1</span>
            </div>
            
            <div class="button-groups">
                <!-- Up Button -->
                <div class="arrow-buttons">
                    <button class="btn btn-arrow" id="up-btn" onclick="moveElevator('up')" title="Up">↑</button>
                </div>
                
                <!-- Floor Buttons -->
                <div class="floor-buttons">
                    <button class="btn btn-floor" onclick="moveElevator(1)">1</button>
                    <button class="btn btn-floor" onclick="moveElevator(2)">2</button>
                    <button class="btn btn-floor" onclick="moveElevator(3)">3</button>
                </div>
                
                <!-- Down Button -->
                <div class="arrow-buttons">
                    <button class="btn btn-arrow" id="down-btn" onclick="moveElevator('down')" title="Down">↓</button>
                </div>
                
                <!-- Door Controls -->
                <div class="door-buttons">
                    <button class="btn btn-door" id="open-btn" onclick="operateDoor('open')" title="Open Doors">◄►</button>
                    <button class="btn btn-door" id="close-btn" onclick="operateDoor('close')" title="Close Doors">►◄</button>
                </div>
            </div>
            
            <div class="status-message" id="status-message"></div>
            
            <div class="info-panel">
                <strong>Test Features:</strong><br>
                • Visual elevator animation<br>
                • Real-time floor updates<br>
                • Door open/close simulation<br>
                • Connected to same DB as index.php<br>
                • Database: elevator (ese user)
            </div>
        </div>
    </div>

    <script>
        let currentFloor = 1;
        let pollInterval;
        let doorTimeout = null;
        let isLockedOut = false;
        
        // Floor positions for elevator car (bottom values)
        const floorPositions = {
            1: '20px',   // Bottom floor
            2: '140px',  // Middle floor  
            3: '260px'   // Top floor
        };
        
        // Start polling when page loads
        window.onload = function() {
            updateFloorDisplay();
            startPolling();
            
            // Get initial floor status
            pollFloorStatus();
        };
        
        function startPolling() {
            pollInterval = setInterval(pollFloorStatus, 2000);
        }
        
        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        }
        
        function pollFloorStatus() {
            fetch('../php/test_elevator_api.php')
                .then(response => response.json())
                .then(data => {
                    // Update connection status
                    updateConnectionStatus(data.database_connected || false);
                    
                    // Update lockout status
                    updateLockoutStatus(data.is_locked_out || false, data.lockout_reason, data.locked_by);
                    
                    if (data.success && data.current_floor !== currentFloor) {
                        currentFloor = data.current_floor;
                        updateFloorDisplay();
                        animateElevatorToFloor(currentFloor);
                    }
                })
                .catch(error => {
                    console.error('Polling error:', error);
                    updateConnectionStatus(false);
                });
        }
        
        function moveElevator(direction) {
            // Check if system is locked out
            if (isLockedOut) {
                showStatus('Elevator operations are locked out for safety', 'error');
                return;
            }
            
            let targetFloor;
            
            if (direction === 'up') {
                targetFloor = Math.min(3, currentFloor + 1);
            } else if (direction === 'down') {
                targetFloor = Math.max(1, currentFloor - 1);
            } else {
                targetFloor = parseInt(direction);
            }
            
            if (targetFloor === currentFloor) {
                showStatus(`Already on floor ${targetFloor}`, 'success');
                return;
            }
            
            // Show loading state
            showStatus(`Moving to floor ${targetFloor}...`, 'loading');
            setButtonsEnabled(false);
            
            // Start elevator animation immediately for better UX
            animateElevatorToFloor(targetFloor);
            
            fetch('../php/test_elevator_api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `action=move_floor&newfloor=${targetFloor}`
            })
            .then(response => response.json())
            .then(data => {
                // Update connection status
                updateConnectionStatus(data.database_connected || false);
                
                // Update lockout status
                updateLockoutStatus(data.is_locked_out || false, data.lockout_reason, data.locked_by);
                
                if (data.success) {
                    currentFloor = data.current_floor;
                    updateFloorDisplay();
                    showStatus(data.message, 'success');
                } else {
                    showStatus('Error: ' + data.message, 'error');
                }
                
                setButtonsEnabled(!isLockedOut);
            })
            .catch(error => {
                console.error('Error:', error);
                updateConnectionStatus(false);
                showStatus('Network error occurred', 'error');
                setButtonsEnabled(!isLockedOut);
            });
        }
        
        function animateElevatorToFloor(floor) {
            const elevatorCar = document.getElementById('elevator-car');
            elevatorCar.style.bottom = floorPositions[floor];
            elevatorCar.classList.add('moving');
            
            setTimeout(() => {
                elevatorCar.classList.remove('moving');
            }, 2000);
        }
        
        function operateDoor(action) {
            const leftDoor = document.getElementById('door-left');
            const rightDoor = document.getElementById('door-right');
            const btn = document.getElementById(action + '-btn');
            const otherBtn = document.getElementById(action === 'open' ? 'close-btn' : 'open-btn');
            
            // Highlight the clicked button
            btn.classList.add('selected');
            otherBtn.classList.remove('selected');
            
            if (doorTimeout) clearTimeout(doorTimeout);
            doorTimeout = setTimeout(() => {
                btn.classList.remove('selected');
            }, 3000);
            
            if (action === 'open') {
                leftDoor.classList.add('open');
                rightDoor.classList.add('open');
                showStatus('Doors opening...', 'loading');
            } else {
                leftDoor.classList.remove('open');
                rightDoor.classList.remove('open');
                showStatus('Doors closing...', 'loading');
            }
            
            setTimeout(() => {
                clearStatus();
            }, 2000);
        }
        
        function updateFloorDisplay() {
            document.getElementById('current-floor').textContent = currentFloor;
            
            // Update floor button states
            const floorButtons = document.querySelectorAll('.btn-floor');
            floorButtons.forEach((btn, index) => {
                if (index + 1 === currentFloor) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Update arrow button states
            const upBtn = document.getElementById('up-btn');
            const downBtn = document.getElementById('down-btn');
            
            upBtn.disabled = (currentFloor >= 3);
            downBtn.disabled = (currentFloor <= 1);
        }
        
        function setButtonsEnabled(enabled) {
            const buttons = document.querySelectorAll('.btn:not(.btn-door)');
            buttons.forEach(btn => {
                btn.disabled = !enabled;
            });
            
            if (enabled && !isLockedOut) {
                updateFloorDisplay();
            }
        }
        
        function updateLockoutStatus(lockedOut, reason, lockedBy) {
            isLockedOut = lockedOut;
            const lockoutDiv = document.getElementById('lockoutStatus');
            
            lockoutDiv.style.display = 'block';
            
            if (lockedOut) {
                lockoutDiv.className = 'lockout-status locked-out';
                lockoutDiv.innerHTML = `🔒 ELEVATOR LOCKED OUT<br><small>Reason: ${reason || 'Safety lockout'}<br>By: ${lockedBy || 'Administrator'}</small>`;
                
                // Disable all elevator controls
                setButtonsEnabled(false);
            } else {
                lockoutDiv.className = 'lockout-status operational';
                lockoutDiv.innerHTML = '✅ System Operational';
                
                // Re-enable controls if not locked out
                setButtonsEnabled(true);
            }
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
        }
        
        function clearStatus() {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = '';
            statusEl.className = 'status-message';
        }
        
        // Update connection status indicator
        function updateConnectionStatus(connected) {
            const statusDiv = document.getElementById('connectionStatus');
            const indicator = statusDiv.querySelector('.status-indicator');
            
            if (connected) {
                statusDiv.className = 'connection-status connected';
                indicator.className = 'status-indicator connected';
                statusDiv.innerHTML = '<div class="status-indicator connected"></div>Database Connected';
            } else {
                statusDiv.className = 'connection-status disconnected';
                indicator.className = 'status-indicator disconnected';
                statusDiv.innerHTML = '<div class="status-indicator disconnected"></div>Database Disconnected';
            }
        }
        
        // Stop polling when page unloads
        window.addEventListener('beforeunload', stopPolling);
    </script>
</body>
</html>
